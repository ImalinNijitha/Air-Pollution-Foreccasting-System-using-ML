<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AirGuard AI — Login</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}"/>
</head>
<body class="auth-body">

<div class="auth-container">
  <div class="auth-brand">
    <span class="nav-dot"></span>
    AirGuard <strong>AI</strong>
  </div>
  <p class="auth-tagline">Industrial Pollution Forecasting & Monitoring</p>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="flash flash-{{ category }}">{{ message }}</div>
    {% endfor %}
  {% endwith %}

  <form method="POST" action="{{ url_for('auth.login') }}" class="auth-form">
    <div class="form-group">
      <label>Username</label>
      <input type="text" name="username" required placeholder="Enter username"/>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" name="password" required placeholder="Enter password"/>
    </div>
    <button type="submit" class="btn-primary">Login</button>
  </form>
  <p class="auth-link">No account? <a href="{{ url_for('auth.register') }}">Register here</a></p>
</div>

</body>
</html>
